name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      # The required build check must cover Vercel's missing-origin checkout.
      - name: Reproduce Vercel checkout without origin
        if: matrix.command == 'build'
        run: git remote remove origin
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test CI and release scripts
        run: node --test scripts/*.test.mjs
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Validate commit subject
        if: github.event_name != 'pull_request'
        run: git log -1 --format=%B | pnpm exec commitlint
      - name: Classify package changes
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_REF_NAME: ${{ github.ref_name }}
        run: node scripts/ci-changes.mjs
      # Consumed changesets are removed by versioning. Validate the prepared
      # version and changelog when the manifest changes without pending notes.
      - name: Validate changesets
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          if git diff --name-only --no-renames --diff-filter=AM "$BASE_REF"...HEAD -- .changeset | grep -Ev '^\.changeset/README\.md$' | grep -Eq '^\.changeset/[^/]+\.md$'; then
            pnpm exec changeset status --since "$BASE_REF"
          elif ! git diff --quiet "$BASE_REF"...HEAD -- packages/valve/package.json; then
            node scripts/validate-versioned-release.mjs "$BASE_REF"
          fi
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.changeset == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- .changeset | grep -Ev '^\.changeset/README\.md$' | grep -Eq '^\.changeset/(pre/)?[^/]+\.md$'; then
            echo 'Add a changeset with pnpm changeset for user-facing package changes.'
            exit 1
          fi
