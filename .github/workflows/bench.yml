name: Benchmarks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  footprint-controls:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - name: Check out the PR baseline without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-baseline
          persist-credentials: false
      - name: Prepare the PR baseline before timing
        working-directory: .benchmark-baseline
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/valve build
      - name: Paired bundle, startup, and shared-store controls
        env:
          REDIS_URL: redis://127.0.0.1:6379
          VALKEY_URL: redis://127.0.0.1:6380
        run: |
          mkdir -p /tmp/valve-footprint-results
          node scripts/bundle-footprint.mjs "$GITHUB_WORKSPACE/.benchmark-baseline" /tmp/valve-footprint-results/baseline-size.json
          node scripts/bundle-footprint.mjs "$PWD" /tmp/valve-footprint-results/current-size.json
          node scripts/footprint-startup.mjs "$GITHUB_WORKSPACE/.benchmark-baseline" "$PWD" /tmp/valve-footprint-results/startup.json
          node scripts/paired-footprint-controls.mjs "$GITHUB_WORKSPACE/.benchmark-baseline" /tmp/valve-footprint-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: footprint-controls
          path: /tmp/valve-footprint-results
  local:
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - run: pnpm bench
        if: github.event_name != 'pull_request'
        env:
          VALVE_BENCH_LIBRARY: ${{ github.workspace }}/packages/valve/dist/index.js
          VALVE_BENCH_OUT: /tmp/current.json
          VALVE_BENCH_SKIP_BOTTLENECK: '1'
      - name: Check out the PR baseline without credentials
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-baseline
          persist-credentials: false
      - name: Compare with the PR base on the same runner
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:packages/valve/src/index.ts" 2>/dev/null; then
            pnpm --dir "$GITHUB_WORKSPACE/.benchmark-baseline" install --frozen-lockfile
            pnpm --dir "$GITHUB_WORKSPACE/.benchmark-baseline" --filter valvejs build
            node scripts/paired-benchmarks.mjs "$GITHUB_WORKSPACE/.benchmark-baseline/packages/valve/dist/index.js" /tmp/base.json /tmp/current.json
            node scripts/compare-benchmarks.mjs /tmp/base.json /tmp/current.json
          else
            VALVE_BENCH_LIBRARY="$PWD/packages/valve/dist/index.js" VALVE_BENCH_SKIP_BOTTLENECK=1 VALVE_BENCH_OUT=/tmp/current.json pnpm bench
            echo 'First implementation establishes the benchmark baseline.'
          fi
  redis:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      store:
        image: redis:7.4
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm --filter valvejs exec tsx bench/redis.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
