name: Benchmarks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
        env:
          VALVE_BENCH_OUT: /tmp/current.json
          VALVE_BENCH_SKIP_BOTTLENECK: '1'
      - name: Compare with the PR base on the same runner
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:packages/valve/src/index.ts" 2>/dev/null; then
            git worktree add --detach /tmp/valve-baseline "$BASE_SHA"
            VALVE_BENCH_LIBRARY=/tmp/valve-baseline/packages/valve/src/index.ts VALVE_BENCH_SKIP_BOTTLENECK=1 VALVE_BENCH_OUT=/tmp/base.json pnpm bench
            node scripts/compare-benchmarks.mjs /tmp/base.json /tmp/current.json
          else
            echo 'First implementation establishes the benchmark baseline.'
          fi
  redis:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      store:
        image: redis:7.4
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ksaurav24/valve build
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm --filter @ksaurav24/valve exec tsx bench/redis.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
