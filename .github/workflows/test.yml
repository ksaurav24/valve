name: Tests and package
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  unit:
    name: tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.library == 'true' || needs.changes.outputs.package == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        if: needs.changes.outputs.library == 'true'
      - run: pnpm test:types
        if: needs.changes.outputs.library == 'true'
      - run: pnpm --filter valvejs build
      - run: pnpm check:source
      - run: pnpm check:package
  website:
    name: website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      # Vercel checkouts may lack origin. Keep install hooks and the full
      # website build independent of remote discovery (including TypeDoc).
      - name: Reproduce Vercel checkout without origin
        run: git remote remove origin
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @valve/web test
      - name: Build website for deployment
        run: pnpm docs:build
      - run: pnpm --filter @valve/web exec playwright install --with-deps chromium
      - run: pnpm --filter @valve/web test:browser
  integration:
    name: integration (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            'redis:6.2',
            'redis:7.4',
            'redis:8',
            'valkey/valkey:7.2',
            'valkey/valkey:8',
          ]
    services:
      store:
        image: ${{ matrix.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm examples
        env:
          REDIS_URL: redis://127.0.0.1:6379
  cluster-and-recovery:
    name: cluster and recovery
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: bash scripts/cluster-test.sh
      - run: pnpm --filter valvejs build
      - run: pnpm test:integration
        env:
          REDIS_CLUSTER_URL: redis://127.0.0.1:17300
          REDIS_SERVER_BIN: /usr/bin/redis-server
