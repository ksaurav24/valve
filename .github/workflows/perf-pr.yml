name: Performance harness PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  portable:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.benchmarks == 'true')
    name: Unit, typecheck, and quick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - name: Unit tests
        run: pnpm --filter @valve/perf test
      - name: Typecheck
        run: pnpm --filter @valve/perf typecheck
      - name: Portable quick tier
        run: pnpm perf quick
      - name: Public drift diagnostic
        run: pnpm perf drift --jobs 20 --response-ms 5 --reps 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-pr-portable-${{ github.run_attempt }}
          path: .perf/runs/
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.benchmarks == 'true')
    name: Redis 7.4 and Valkey 8 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter valvejs build
      - name: Start guarded disposable stores
        run: |
          pnpm perf infra up redis74
          pnpm perf infra up valkey8
          pnpm perf infra status
      - name: Verify real-store integration and C1 regression
        run: |
          PERF_INTEGRATION=1 pnpm --filter @valve/perf test:integration
          pnpm perf c1 --stores memory,redis74,valkey8
      - name: Scoped admission cardinality and contention probe
        run: pnpm perf scoped --stores memory,redis74,valkey8 --iterations 2
      - name: Run the smoke profile
        run: pnpm perf smoke --stores memory,redis74,valkey8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-pr-smoke-${{ github.run_attempt }}
          path: .perf/runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable stores
        if: always()
        run: |
          pnpm perf infra down redis74
          pnpm perf infra down valkey8

  footprint:
    name: Bundle budgets and cold startup
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.benchmarks == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure both builds with the current harness
        env:
          PERF_BASE_REF: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          args=()
          if [[ -n "$PERF_BASE_REF" ]]; then args+=(--base "$PERF_BASE_REF"); fi
          pnpm perf footprint --check "${args[@]}"
          pnpm perf startup "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-pr-footprint-${{ github.run_attempt }}
          path: .perf/runs/
          if-no-files-found: warn
          retention-days: 14
