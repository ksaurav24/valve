name: Initialize issue labels

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Valve labels exist
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const labels = [
              ['bug', 'D73A4A', 'Incorrect behavior or regression'],
              ['enhancement', 'A2EEEF', 'Feature or improvement'],
              ['documentation', '0075CA', 'Documentation and examples'],
              ['perf', 'F9D0C4', 'Performance analysis and optimization'],
              ['research', '7057FF', 'Investigation before committing to implementation'],
              ['security', 'B60205', 'Security hardening; disclose vulnerabilities privately'],
              ['priority:p0', 'B60205', 'Release-blocking correctness or security issue'],
              ['priority:p1', 'FBCA04', 'Important issue for the target milestone'],
              ['priority:p2', 'C5DEF5', 'Optional improvement or investigation'],
              ['size/xs', 'C2E0C6', 'PR review size: up to 20 changed lines'],
              ['size/s', 'BFDADC', 'PR review size: 21-100 changed lines'],
              ['size/m', 'FEF2C0', 'PR review size: 101-300 changed lines'],
              ['size/l', 'F9D0C4', 'PR review size: 301-700 changed lines'],
              ['size/xl', 'D93F0B', 'PR review size: over 700 changed lines']
            ];
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100
            });
            const names = new Set(existing.map(x => x.name.toLowerCase()));
            for (const [name, color, description] of labels) {
              if (names.has(name.toLowerCase())) continue;
              await github.rest.issues.createLabel({owner, repo, name, color, description});
              core.info(`Created ${name}`);
            }
