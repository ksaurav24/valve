name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of untrusted PR code.
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Label by changed line count
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            // Generated lockfile and results are excluded from review-size estimates.
            const ignored = (path) =>
              path === 'pnpm-lock.yaml' || path.startsWith('.perf/');
            const lines = files.filter(f => !ignored(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const size = lines <= 20 ? 'size/xs'
              : lines <= 100 ? 'size/s'
              : lines <= 300 ? 'size/m'
              : lines <= 700 ? 'size/l' : 'size/xl';
            const prefixes = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pull_number, per_page: 100
            });
            for (const label of current.filter(l => prefixes.includes(l.name) && l.name !== size)) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pull_number, name: label.name
              });
            }
            if (!current.some(l => l.name === size)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pull_number, labels: [size]
              });
            }
            core.info(`PR #${pull_number}: ${lines} changed review lines => ${size}`);
